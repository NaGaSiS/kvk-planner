<!-- Language Selector Component -->
<div id="lang-selector" class="relative flex-shrink-0">
    <button
        id="lang-btn"
        onclick="document.getElementById('lang-dropdown').classList.toggle('hidden')"
        class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 text-sm text-gray-300 hover:text-white transition-all"
        aria-label="Select language"
    >
        <span id="lang-flag" class="text-base">🌐</span>
        <span id="lang-label" class="font-medium uppercase text-xs">EN</span>
        <svg class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div id="lang-dropdown" class="hidden absolute right-0 top-full mt-1 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl py-1 z-50 min-w-[130px]">
        <button onclick="setLang('en'); updateLangUI(); this.closest('#lang-dropdown').classList.add('hidden')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
            <span>🇬🇧</span> <span>English</span>
        </button>
        <button onclick="setLang('es'); updateLangUI(); this.closest('#lang-dropdown').classList.add('hidden')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
            <span>🇪🇸</span> <span>Español</span>
        </button>
        <button onclick="setLang('fr'); updateLangUI(); this.closest('#lang-dropdown').classList.add('hidden')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
            <span>🇫🇷</span> <span>Français</span>
        </button>
        <button onclick="setLang('de'); updateLangUI(); this.closest('#lang-dropdown').classList.add('hidden')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
            <span>🇩🇪</span> <span>Deutsch</span>
        </button>
        <button onclick="setLang('pt'); updateLangUI(); this.closest('#lang-dropdown').classList.add('hidden')" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
            <span>🇧🇷</span> <span>Português</span>
        </button>
    </div>
</div>
<script>
function updateLangUI() {
    if (!window.KVK_LANG || !window.t) return; // guard: i18n.js not loaded yet
    const flags = { en: '🇬🇧', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', pt: '🇧🇷' };
    const lang = window.KVK_LANG;
    const flagEl = document.getElementById('lang-flag');
    const labelEl = document.getElementById('lang-label');
    if (flagEl) flagEl.textContent = flags[lang] || '🌐';
    if (labelEl) labelEl.textContent = lang.toUpperCase();
    document.documentElement.setAttribute('lang', lang);
    // Re-apply all data-i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key) el.textContent = window.t(key);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (key) el.placeholder = window.t(key);
    });
}
document.addEventListener('DOMContentLoaded', updateLangUI);
document.addEventListener('kvk-lang-change', updateLangUI);
// Close dropdown on outside click
document.addEventListener('click', function(e) {
    const dd = document.getElementById('lang-dropdown');
    const btn = document.getElementById('lang-btn');
    if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) {
        dd.classList.add('hidden');
    }
});
</script>
